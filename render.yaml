services:
  - type: web
    name: leadpilot-api
    env: python
    region: oregon
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: RESEND_FROM_EMAIL
        value: numan@leadpilot-ai.online
      - key: RESEND_API_KEY
        sync: false
