name: Server CI

on:
  push:
    branches: [ main, structure-creating ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cd server && pip install -r requirements.txt
      - run: cd server && pytest
