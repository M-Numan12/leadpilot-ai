[tool.poetry]
name = "leadpilot-server"
version = "0.1.0"
description = "LeadPilot AI FastAPI Server"
authors = ["LeadPilot Team <team@leadpilot.ai>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.29"}
asyncpg = "^0.29.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.2.0"
alembic = "^1.13.1"
openai = "^1.23.0"
redis = "^5.0.3"
celery = "^5.4.0"
httpx = "^0.27.0"
pyjwt = "^2.8.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
langgraph = "^0.0.50"
langchain-core = "^0.1.50"
langchain-openai = "^0.1.0"
pgvector = "^0.2.5"
playwright = "^1.43.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
